version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: warathah-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: warathah
      POSTGRES_USER: ${DB_USER:-warathah}
      POSTGRES_PASSWORD: ${DB_PASS:-warathah}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warathah"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warathah-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/warathah
      DB_USER: ${DB_USER:-warathah}
      DB_PASS: ${DB_PASS:-warathah}
      JWT_SECRET: ${JWT_SECRET:-warathah-secret-key-change-in-production-must-be-256-bits}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: warathah-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: warathah-network
