spring.application.name=warathah
server.port=8080
server.servlet.context-path=/api/v1

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/warathah}
spring.datasource.username=${DB_USER:warathah}
spring.datasource.password=${DB_PASS:warathah}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:warathah-secret-key-change-in-production-must-be-at-least-256-bits-long}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.warathah=DEBUG
