name: مزامنة المنصة إلى Darshuse/al-wiratha

on:
  workflow_dispatch:
  push:
    branches: [claude/al-wiratha-platform-puneqz]
    paths: ["al-wiratha/**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # بدون هذا السطر يحقن checkout توكنه المحدود في git config
          # فيُرسَل بدل توكن المزامنة ويفشل الدفع بـ "Repository not found"
          persist-credentials: false

      - name: فصل تاريخ مجلد al-wiratha كمستودع مستقل
        run: git subtree split --prefix=al-wiratha -b wiratha-split

      # يُدفع إلى فرع platform (وليس master) حفاظاً على المحتوى القديم في المستودع —
      # لجعله الفرع الرئيسي: Settings → Branches → Default branch → platform
      - name: الدفع إلى المستودع المخصص
        env:
          # يقبل أياً من الاسمين — MY_ALL_REPO_TOKEN هو المضاف فعلاً
          PUSH_TOKEN: ${{ secrets.MY_ALL_REPO_TOKEN || secrets.my_all_repo_token || secrets.WIRATHA_PUSH_TOKEN }}
        run: |
          # تنظيف أي مسافات/أسطر التصقت أثناء النسخ
          TOKEN="$(printf '%s' "$PUSH_TOKEN" | tr -d '[:space:]')"
          echo "طول التوكن في الـ secret: ${#TOKEN} (المتوقع: 93)"
          echo "بادئة التوكن: ${TOKEN:0:22}... (الجديد ينتهي بـ I0Ss / القديم I0Lv)"
          echo "— هوية التوكن من GitHub مباشرة:"
          curl -s -H "Authorization: Bearer ${TOKEN}" https://api.github.com/user | grep -o '"login": *"[^"]*"' || echo "فشل التحقق من الهوية"
          echo "— وصول التوكن للريبو عبر API (يحتاج Metadata فقط):"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer ${TOKEN}" https://api.github.com/repos/Darshuse/al-wiratha
          echo "— فحص صلاحية Contents تحديداً (قراءة ملفات الريبو):"
          curl -s -o /dev/null -w "HTTP %{http_code} (200=Contents موجودة، 404=Contents ناقصة)\n" -H "Authorization: Bearer ${TOKEN}" https://api.github.com/repos/Darshuse/al-wiratha/contents/
          # التوكنات الشخصية fine-grained تحتاج اسم المستخدم الحقيقي في basic auth
          AUTH_URL="https://Darshuse:${TOKEN}@github.com/Darshuse/al-wiratha.git"
          echo "— اختبار قراءة git (صيغة username):"
          if git ls-remote "$AUTH_URL" HEAD; then
            echo "— الدفع:"
            git push "$AUTH_URL" wiratha-split:refs/heads/main --force
          else
            echo "— صيغة username فشلت، تجربة Bearer header:"
            git -c http.extraHeader="Authorization: Bearer ${TOKEN}" ls-remote https://github.com/Darshuse/al-wiratha.git HEAD
            echo "— الدفع (Bearer):"
            git -c http.extraHeader="Authorization: Bearer ${TOKEN}" push https://github.com/Darshuse/al-wiratha.git \
              wiratha-split:refs/heads/main --force
          fi
